services:
  - type: web
    name: sih-dead-reckoning-backend
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws websockets
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: IMU_SAMPLING_RATE_HZ
        value: "10.0"
      - key: BACKLOG_CHUNK_SIZE
        value: "20"
      - key: MAX_QUEUE_SIZE
        value: "50000"
      - key: REDIS_URL
        value: "redis://localhost:6379/0" # Falls back to internal LRU if omitted
      - key: DATABASE_URL
        fromDatabase:
          name: sih-timescaledb-postgres
          property: connectionString

databases:
  - name: sih-timescaledb-postgres
    plan: starter
    region: oregon
    databaseName: sih_db
    user: postgres

